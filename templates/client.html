<!DOCTYPE html>
<html lang="en">
	<head>
		<meta name="viewport" content="width=device-width, initial-scale=1" />

		<link href="/css/client.css" rel="stylesheet" />
		<script src="/js/toast.js"></script>
		<script src="/js/routing.js"></script>
		<script src="/js/server.js"></script>
		<script src="/js/client.js"></script>

		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700;900&display=swap"
			rel="stylesheet"
		/>
		<script
			src="https://kit.fontawesome.com/531793c136.js"
			crossorigin="anonymous"
		></script>

		<link
			href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
			rel="stylesheet"
			integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
			crossorigin="anonymous"
		/>
		<title>Twidder</title>
	</head>
	<body>
		<div id="content">
			<p>hello world</p>
		</div>
		<script type="text/view" id="loginView">
			<div class="container row">
			  <div class="logo col-sm-12 col-md-6">
					<picture>
						<source srcset="/images/wimage.png" media="(min-width: 768px)">
			    	<img src="/images/wimage_small.png" />
					</picture>
			  </div>
			  <div class="login-container col-sm-12 col-md-4">
			    <form id="login" name="login">
						<h3>Login</h3>
			      <label for="login-email" class="form-label">Email</label>
			      <input id="login-email" class="form-control" name="email" type="email" required />

			      <label for="login-password" class="form-label">Password</label>
			      <input id="login-password" class="form-control" name="password" type="password" required />

						<div class="row">
							<div class="col">
			      		<button class="btn btn-success" type="submit">login</button>
							</div>
						</div>
						<a class="link" onclick="refresh(true)">Create new account</a><br />
						<a href="/request_password_reset">Reset password</a>
			    </form>
			  </div>
			</div>
		</script>
		<script type="text/view" id="signupView">
			<div class="container row">
			  <div class="logo col-sm-12 col-md-6">
					<picture>
						<source srcset="/images/wimage.png" media="(min-width: 768px)">
			    	<img src="/images/wimage_small.png" />
					</picture>
			  </div>
			  <div class="login-container col-sm-12 col-md-4">
					<form id="signup" name="signup">
						<h3>Sign up</h3>
						<div class="row">
							<div class="col-md-6 col-sm-12">
								<label for="signup-firstname" class="form-label">First name</label>
								<input id="signup-firstname" class="form-control" name="firstname" type="text" required />
							</div>
							<div class="col-md-6 col-sm-12">
								<label for="signup-lastname" class="form-label">Last name</label>
								<input id="signup-lastname" class="form-control" name="lastname" type="text" required />
							</div>
						</div>
						<div class="row">
							<div class="col-md-6 col-sm-3">
								<label for="signup-gender" class="form-label">Gender</label>
								<select name="gender" id="signup-gender" class="form-select">
									<option value="male">Male</option>
									<option value="female">Female</option>
									<option value="other">Other</option>
								</select>
							</div>
							<div class="col col-sm-9 col-md-6">
								<label for="signup-email" class="form-label">Email</label>
								<input id="signup-email" class="form-control" name="email" type="email" required />
							</div>
						</div>
						<div class="row">
							<div class="col-6">
								<label for="signup-city" class="form-label">City</label>
								<input id="signup-city" class="form-control" name="city" type="text" required />
								</div>
							<div class="col-6">
								<label for="signup-country" class="form-label">Country</label>
								<input id="signup-country" class="form-control" name="country" type="text" required />
								</div>
						</div>
						<div class="row">
							<div class="col-sm-12 col-md-6">
								<label for="signup-password" class="form-label">Password</label>
								<input id="signup-password" name="password" type="password" class="form-control"
									type="password" oninput="this.setCustomValidity('')" required />
							</div>
							<div class="col-sm-12 col-md-6">
								<label for="signup-password-repeat" class="form-label">Repeat psw</label>
								<input id="signup-password-repeat" name="password_repeat" class="form-control"
										type="password" oninput="this.setCustomValidity('')" required />
							</div>
						</div>
						<div class="row">
							<div class="col">
								<button class="btn btn-success" type="submit">sign up</button>
							</div>
						</div>
						<a class="link" onclick="refresh(false)">Login instead</a>
					</form>
				</div>
			</div>
		</script>
		<script type="text/view" id="profileView">
			<div class="navbar">
				<ul>
					<li class="home" onclick="changeTab('home')" data-active>Home</li>
					<li class="browse" onclick="changeTab('browse')">Browse</li>
					<li class="account" onclick="changeTab('account')">Account</li>
				</ul>
			</div>
			<div class="content">
				<div id="home" class="container" data-show="true">
					<div class="personal_information">
						<div
							class="return hidden"
							onclick="changeTab('home', null)"
						>
							<i class="fa-solid fa-arrow-left fa-xl"></i>
						</div>
						<div class="data">
							<span id="fullname">Test Name</span>
							<span id="gender">Male</span>
							<br />
							<span id="email">test.mail@test.com</span>
							<br />
							located in <span id="location">Linköping, Sweden</span>
						</div>
					</div>
					<div class="messages">
						<div class="new_message">
							<form name="post">
								<textarea
									rows="3"
									name="message"
									placeholder="Post your message here"
								></textarea>
								<button type="submit">Post</button>
							</form>
						</div>
						<div class="reload_messages">
							<button type="button" onclick="reloadMessages()">
								<i class="fa-solid fa-rotate-right"></i>
								Reload messages
							</button>
						</div>
						<div class="message_history" id="history">
							<div id="example_message" class="message">
								<div class="profile_information">
									<span>Test user</span> posted
								</div>
								<div class="message_content">
									This is an example message<br />
									With a linebreak in it that is longer than it should be thus it
									needs to be wrapped inside the div
								</div>
							</div>
						</div>
					</div>
				</div>
				<div id="browse" class="container" data-show="false">
					<h2>Browse users</h2>
					<form name="search">
						<input type="text" name="searchbar" placeholder="Search for user" />
						<button type="submit">Search</button>
					</form>
					<div class="users" id="search_results">
						<div id="example_result" class="user">
							<span class="fullname">Test user</span>,
							<span class="email">test@mail.com</span>
						</div>
					</div>
				</div>
				<div id="account" class="container" data-show="false">
					<h2>Your account</h2>

					<h3>Change password</h3>
					<form name="password_reset" class="password-reset">
						<label for="pw-reset-old">Current Password</label>
						<input
							type="password"
							name="password_old"
							id="pw-reset-old"
							oninput="this.setCustomValidity('')"
						/>

						<label for="pw-reset-new">New Password</label>
						<input
							type="password"
							name="password"
							id="pw-reset-new"
							oninput="this.setCustomValidity('')"
						/>

						<label for="pw-reset-rpt-new">Confirm New Password</label>
						<input
							type="password"
							name="password_repeat"
							id="pw-reset-rpt-new"
							oninput="this.setCustomValidity('')"
						/>

						<button type="submit">Change password</button>
					</form>

					<div class="signout">
						<h3>Sign out</h3>
						<button type="button" class="btn btn-signout" onclick="logout()">Sign out</button>
					</div>
				</div>
			</div>
		</script>

		<script
			src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
			integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
			crossorigin="anonymous"
		></script>
	</body>
</html>
