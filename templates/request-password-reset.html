<html>
	<head>
		<meta name="viewport" content="width=device-width, initial-scale=1" />

		<title>Password reset</title>
		<script src="/js/toast.js"></script>
		<script src="/js/server.js"></script>
		<script src="/js/request-password-reset.js"></script>
		<link href="/css/client.css" rel="stylesheet" />

		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700;900&display=swap"
			rel="stylesheet"
		/>
		<link
			href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
			rel="stylesheet"
			integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
			crossorigin="anonymous"
		/>
	</head>
	<body>
		<div id="content">
			<div class="container row">
				<div class="logo col-sm-12 col-md-6">
					<picture>
						<source srcset="/images/wimage.png" media="(min-width: 768px)" />
						<img src="/images/wimage_small.png" />
					</picture>
				</div>
				<div class="form col-sm-12 col-md-4">
					<h3>Request password reset</h3>
					<form name="request_password_reset" class="password-reset">
						<label for="email" class="form-label">Email</label>
						<input
							type="email"
							name="email"
							id="email"
							class="form-control"
							required
						/>

						<button class="btn btn-success" name="submit" type="submit">
							Request password reset
						</button>
					</form>
				</div>
			</div>
		</div>

		<script
			src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
			integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
			crossorigin="anonymous"
		></script>
	</body>
</html>
