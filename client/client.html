<html>
	<head>
		<link href="client.css" type="text/css" rel="stylesheet" />
		<script src="client.js" type="text/javascript"></script>
		<script src="serverstub.js" type="text/javascript"></script>

		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700;900&display=swap"
			rel="stylesheet"
		/>
		<script
			src="https://kit.fontawesome.com/531793c136.js"
			crossorigin="anonymous"
		></script>
	</head>
	<body>
		<div id="content">
			<p>hello world</p>
		</div>
		<script type="text/view" id="welcomeView">
			<div class="container">
			  <div class="logo">
			    <img src="wimage.png" />
			  </div>
			  <div class="login-container">
			    <form id="login" name="login">
			      <label for="login-email">Email</label>
			      <input id="login-email" name="email" type="email" required />

			      <label for="login-password">Password</label>
			      <input id="login-password" name="password" type="password" required />

			      <button class="btn-login" type="submit">login</button>
			    </form>
			    <form id="signup" name="signup">
			      <h3>Sign up here</h3>
			      <label for="signup-firstname">First name</label>
			      <input id="signup-firstname" name="firstname" type="text" required />

			      <label for="signup-lastname">Last name</label>
			      <input id="signup-lastname" name="lastname" type="text" required />

			      <label for="signup-gender">Gender</label>
			         <select name="gender" id="signup-gender">
			           <option value="male">Male</option>
			           <option value="female">Female</option>
			           <option value="other">Other</option>
			         </select>

			      <label for="signup-city">City</label>
			      <input id="signup-city" name="city" type="text" required />

			      <label for="signup-country">Country</label>
			      <input id="signup-country" name="country" type="text" required />

			      <label for="signup-email">Email</label>
			      <input id="signup-email" name="email" type="email" required />

			      <label for="signup-password">Password</label>
			      <input id="signup-password" name="password" type="password"
			         type="password" oninput="this.setCustomValidity('')" required />

			      <label for="signup-password-repeat">Repeat psw</label>
			      <input id="signup-password-repeat" name="password_repeat"
			           type="password" oninput="this.setCustomValidity('')" required />

			      <button class="btn-signup" type="submit">SignUp</button>
			    </form>
			  </div>
			</div>
		</script>
		<script type="text/view" id="profileView">
			<div class="navbar">
				<ul>
					<li class="home" onclick="changeTab('home')" data-active>Home</li>
					<li class="browse" onclick="changeTab('browse')">Browse</li>
					<li class="account" onclick="changeTab('account')">Account</li>
				</ul>
			</div>
			<div class="content">
				<div id="home" class="container" data-show="true">
					<div class="personal_information">
						<div
							class="return hidden"
							onclick="updateProfileInformation(getToken())"
						>
							<i class="fa-solid fa-arrow-left fa-xl"></i>
						</div>
						<div class="data">
							<span id="fullname">Test Name</span>
							<span id="gender">Male</span>
							<br />
							<span id="email">test.mail@test.com</span>
							<br />
							located in <span id="location">Linköping, Sweden</span>
						</div>
					</div>
					<div class="messages">
						<div class="new_message">
							<form name="post">
								<textarea
									rows="5"
									name="message"
									placeholder="Post your message here"
								></textarea>
								<button type="submit">Post</button>
							</form>
						</div>
						<div class="reload_messages">
							<button type="button" onclick="reloadMessages()">
								<i class="fa-solid fa-rotate-right"></i>
								Reload messages
							</button>
						</div>
						<div class="message_history" id="history">
							<div id="example_message" class="message">
								<div class="profile_information">
									<span>Test user</span> posted
								</div>
								<div class="message_content">
									This is an example message<br />
									With a linebreak in it that is longer than it should be thus it
									needs to be wrapped inside the div
								</div>
							</div>
						</div>
					</div>
				</div>
				<div id="browse" class="container" data-show="false">
					<h2>Browse users</h2>
					<form name="search">
						<input type="text" name="searchbar" placeholder="Search for user" />
						<button type="submit">Search</button>
					</form>
					<div class="users" id="search_results">
						<div id="example_result" class="user">
							<span class="fullname">Test user</span>,
							<span class="email">test@mail.com</span>
						</div>
					</div>
				</div>
				<div id="account" class="container" data-show="false">
					<h2>Your account</h2>

					<h3>Change password</h3>
					<form name="password_reset" class="password-reset">
						<label for="pw-reset-old">Current Password</label>
						<input type="password" name="password_old" id="pw-reset-old" />

						<label for="pw-reset-new">New Password</label>
						<input
							type="password"
							name="password_new"
							id="pw-reset-new"
							oninput="this.setCustomValidity('')"
						/>

						<button type="submit">Change password</button>
					</form>

					<h3>Sign out</h3>
					<button type="button" onclick="logout()">Sign out</button>
				</div>
			</div>
		</script>
		<div id="toast"></div>
	</body>
</html>
